name: Build

on:
  push:
    branches: [main, 'ccr-*']
  pull_request:

permissions:
  contents: read

jobs:
  synapse:
    name: Synapse (no Minecraft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./scripts/test-synapse.sh

  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: create-cyberimplants-jar
          path: build/libs/*.jar
          if-no-files-found: error
